services:
  - type: web
    name: rippletrack-api
    runtime: node
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rippletrack-db
          property: connectionString

databases:
  - name: rippletrack-db
    plan: free
